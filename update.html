<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update - QR Code Reader</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                background: #ffffff;
                color: #111111;
                line-height: 1.6;
                padding: 60px 24px;
            }

            .container {
                max-width: 560px;
                margin: 0 auto;
            }

            header {
                margin-bottom: 40px;
                padding-bottom: 20px;
                border-bottom: 1px solid #e5e5e5;
            }

            .version {
                font-size: 13px;
                color: #666666;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                margin-bottom: 4px;
            }

            h1 {
                font-size: 20px;
                font-weight: 600;
                letter-spacing: -0.02em;
            }

            section {
                margin-bottom: 32px;
            }

            h2 {
                font-size: 13px;
                font-weight: 600;
                color: #666666;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 16px;
            }

            ul {
                list-style: none;
            }

            li {
                margin-bottom: 16px;
                padding-left: 12px;
                border-left: 2px solid #111111;
            }

            li strong {
                display: block;
                font-size: 14px;
                font-weight: 600;
                color: #111111;
                margin-bottom: 2px;
            }

            li p {
                font-size: 13px;
                color: #555555;
            }

            .action {
                margin-top: 48px;
                padding-top: 24px;
                border-top: 1px solid #e5e5e5;
            }

            button {
                background: #111111;
                color: #ffffff;
                border: 1px solid #111111;
                padding: 8px 18px;
                font-size: 13px;
                font-weight: 500;
                border-radius: 4px;
                cursor: pointer;
            }

            button:hover {
                background: #333333;
            }

            .qr-preview {
                display: flex;
                align-items: center;
                gap: 20px;
                padding: 16px;
                border: 1px solid #e5e5e5;
                border-radius: 4px;
            }

            .qr-preview img {
                display: block;
                flex-shrink: 0;
            }

            .qr-preview-info {
                font-size: 13px;
                color: #555555;
                line-height: 1.5;
            }

            .qr-preview-info a {
                color: #111111;
                font-size: 12px;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                word-break: break-all;
                display: inline-block;
                margin-top: 6px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <div class="version">v1.2.0</div>
                <h1>QR Code Reader</h1>
            </header>

            <section>
                <h2>Release Notes</h2>
                <ul>
                    <li>
                        <strong>인식률 대폭 상승</strong>
                        <p>QR 코드 인식률 및 성능을 대폭 개선했습니다.</p>
                    </li>
                </ul>
            </section>

            <section>
                <h2>Test Scan</h2>
                <div class="qr-preview">
                    <img
                        src="qr_sample.svg"
                        alt="GitHub Repository QR Code"
                        width="140"
                        height="140"
                    />
                    <div class="qr-preview-info">
                        <p>
                            확장 프로그램을 실행하고 위 QR 코드를 드래그하여
                            인식 기능을 테스트해 보세요.
                        </p>
                        <a
                            href="https://github.com/re0nyaa/QR-Scan-Extention"
                            target="_blank"
                            >https://github.com/re0nyaa/QR-Scan-Extention</a
                        >
                    </div>
                </div>
            </section>

            <div class="action">
                <button onclick="window.close()">닫기</button>
            </div>
        </div>
    </body>
</html>
